name: Notify Telegram about discussions

on:
  discussion:
    types: [created]
  discussion_comment:
    types: [created]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TITLE: ${{ github.event.discussion.title }}
          AUTHOR: ${{ github.event.comment.user.login || github.event.discussion.user.login }}
          BODY: ${{ github.event.comment.body || github.event.discussion.body }}
          URL: ${{ github.event.comment.html_url || github.event.discussion.html_url }}
        run: |
          text=$(printf '💬 %s\n%s:\n%s\n\n%s' "$TITLE" "$AUTHOR" "${BODY:0:500}" "$URL")
          jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$text" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}' |
          curl -fsS -X POST -H 'Content-Type: application/json' -d @- \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" > /dev/null
