<script>
  (() => {
    // Follow the Blowfish appearance toggle, which sets the "dark" class on <html>.
    const theme = () => (document.documentElement.classList.contains("dark") ? "dark" : "light");
    const send = () => {
      const frame = document.querySelector("iframe.giscus-frame");
      frame?.contentWindow.postMessage({ giscus: { setConfig: { theme: theme() } } }, "https://giscus.app");
    };
    new MutationObserver(send).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
    window.addEventListener("message", (e) => {
      if (e.origin === "https://giscus.app" && e.data?.giscus) send();
    });
  })();
</script>
